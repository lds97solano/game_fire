<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regístrate</title>
    <link rel="stylesheet" href="styles/global.css">
    <link rel="stylesheet" href="styles/auth.css">
</head>
<body>
    <div class="container">
        <h1 id="form-title">Regístrate</h1>
        <div class="social-buttons">
            <!-- Botón de Google -->
            <button id="google-btn" class="social-btn google-btn">
                <img src="assets/google.png" alt="Google"> 
            </button>
        </div>
        <div class="separator"><span>O</span></div>

        <!-- Formulario de registro -->
        <form id="register-form">
            <div class="form-group">
                <label for="register-name">Nombre Completo</label>
                <input type="text" id="register-name" placeholder="Ingresa tu nombre completo" required>
            </div>
            <div class="form-group">
                <label for="register-email">Correo Electrónico</label>
                <input type="email" id="register-email" placeholder="Ingresa tu correo" required>
            </div>
            <div class="form-group">
                <label for="register-password">Contraseña</label>
                <input type="password" id="register-password" placeholder="Crea una contraseña" required>
            </div>
            <div class="form-group">
                <label for="confirm-password">Confirma Contraseña</label>
                <input type="password" id="confirm-password" placeholder="Confirma tu contraseña" required>
            </div>
            <button type="submit" class="login-btn">Registrarse</button>
        </form>

        <p id="toggle-text" class="signup-link">
            ¿Ya tienes una cuenta? <a href="login.html" id="toggle-link">Inicia sesión aquí</a>
        </p>
    </div>

    <!-- Enlace al archivo JavaScript -->
    <script src="scripts/register.js" type="module"></script>
</body>
</html>
