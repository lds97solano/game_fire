<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="styles/global.css">
    <link rel="stylesheet" href="styles/auth.css">
</head>
<body>
    <div class="container">
        <h1 id="form-title">Inicia Sesión</h1>
        <div class="social-buttons">
            <button id="google-btn" class="social-btn google-btn">
                <img src="Assets/google.png" alt="Google"> 
            </button>
        </div>
        <div class="separator"><span>O</span></div>
        
        <!-- Formulario de Inicio de Sesión -->
        <form id="login-form">
            <div class="form-group">
                <label for="login-email">Correo Electrónico</label>
                <input type="email" id="login-email" placeholder="Ingresa tu correo electrónico" required>
            </div>
            <div class="form-group">
                <label for="login-password">Contraseña</label>
                <input type="password" id="login-password" placeholder="Ingresa tu contraseña" required>
            </div>
            <a href="#" id="forgot-password" class="forgot-password">¿Olvidaste tu contraseña?</a>
            <button type="submit" class="login-btn">Inicia sesión</button>
            <p id="toggle-text" class="signup-link">
                ¿No tienes una cuenta? <a href="register.html" id="toggle-link">Regístrate</a>
            </p>
        </form>
    </div>
    
    <!-- Enlace al archivo login.js -->
    <script src="scripts/login.js" type="module"></script>
</body>
</html>
