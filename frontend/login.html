<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="styles/global.css">
    <link rel="stylesheet" href="styles/auth.css">
</head>
<body>
    <div class="container">
        <h1 id="form-title">Inicia Sesión</h1>
        <div class="social-buttons">
            <button class="social-btn google-btn"><img src="Assets/google.png" alt="Google"></button>
            <button class="social-btn apple-btn"><img src="Assets/apple.png" alt="Apple"></button>
            <button class="social-btn facebook-btn"><img src="Assets/facebook.png" alt="Facebook"></button>
        </div>
        <div class="separator"><span>O</span></div>
        
        <!-- Formulario de Inicio de Sesión -->
        <form id="login-form">
            <div class="form-group">
                <label for="login-email">Correo Electrónico</label>
                <input type="email" id="login-email" placeholder="Enter your email address" required>
            </div>
            <div class="form-group">
                <label for="login-password">Contraseña</label>
                <input type="password" id="login-password" placeholder="Enter a password" required>
            </div>
            <a href="#" class="forgot-password">Forgot password?</a>
            <button type="submit" class="login-btn">Inisia secion</button>
            <p id="toggle-text" class="signup-link">
                ¿No tienes una cuenta? <a href="register.html" id="toggle-link">Registrate</a>
            </p>
        </form>
